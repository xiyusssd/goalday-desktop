name: Windows Build

# Builds the GoalDay Windows installer (NSIS .exe) on a Windows runner.
# Cross-compiling from macOS is not viable for Tauri (needs MSVC + WebView2),
# so all Windows packaging happens here.
#
# Triggers:
#   - push a tag like v0.1.0  -> builds + attaches the installer to a GitHub Release
#   - manual "Run workflow"   -> builds + uploads the installer as a run artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows installer (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # NSIS .exe only; skip MSI/WiX to keep the build fast.
          args: --bundles nsis
          # When run from a tag, publish a release with the installer attached.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('GoalDay {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: goalday-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
